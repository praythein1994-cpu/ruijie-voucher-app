name: Server Auto-Kick

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  autokick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium --with-deps
      - name: Run auto-kick
        env:
          RUIJIE_EMAIL: ${{ secrets.RUIJIE_EMAIL }}
          RUIJIE_PASSWORD: ${{ secrets.RUIJIE_PASSWORD }}
          RUIJIE_APPID: ${{ secrets.RUIJIE_APPID }}
          RUIJIE_SECRET: ${{ secrets.RUIJIE_SECRET }}
          RUIJIE_GROUP_ID: ${{ secrets.RUIJIE_GROUP_ID }}
        run: python autokick-server/autokick.py

      - name: Commit run summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add autokick-server/last-run.json
          git diff --cached --quiet || git commit -m "Update auto-kick summary [skip ci]"
          git push
