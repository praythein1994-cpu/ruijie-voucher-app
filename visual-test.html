<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>v1.5.48 wobble test (temporary)</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  body { margin: 0; padding: 18px 14px 60px; }
  .vt-sec { max-width: 560px; margin: 0 auto; }
  .vt-sec h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin: 18px 0 10px; }
</style>
<style>.liq-wobble{animation-duration:6s !important;}</style></head>
<body>
<div class="vt-sec">
  <h3>Voucher row (tap me)</h3>
  <div class="voucher-row" id="wobble-row">
    <span class="status-dot s2"></span>
    <div class="voucher-meta">
      <div class="voucher-code">11745476</div>
      <div class="pkg">1GB · 1d</div>
    </div>
    <span class="badge s2">In use</span>
    <span class="chev">›</span>
  </div>
  <h3>Card (tap me)</h3>
  <div class="card" id="wobble-card" style="padding:16px">Sample card content</div>
  <h3>Button (tap me)</h3>
  <button class="btn primary big" id="wobble-btn" style="width:100%">Print</button>
</div>
<script>
/* verbatim from js/app.js (auto-extracted for this test page) */
function initLiquidWobble() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const SEL = 'button,.tab,.voucher-row,.menu-item,.card,.chip,a,[data-wobble]';
  document.addEventListener('pointerdown', e => {
    if (e.clientX == null || e.clientY == null || !e.target || !e.target.closest) return;
    const el = e.target.closest(SEL);
    if (!el || !el.getBoundingClientRect) return;
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height) return;
    el.style.transformOrigin = Math.round(e.clientX - r.left) + 'px ' + Math.round(e.clientY - r.top) + 'px';
    el.classList.remove('liq-wobble');
    void el.offsetWidth; /* restart the wobble when tapped again mid-animation */
    el.classList.add('liq-wobble');
  }, { passive: true });
  document.addEventListener('animationend', e => {
    if (e.animationName === 'liqWobble' && e.target && e.target.classList) {
      e.target.classList.remove('liq-wobble');
    }
  });
}
initLiquidWobble();
</script>

<script>
/* auto-demo: tap the voucher row on load; slow-motion (6s) lets any screenshot catch it mid-wobble */
window.addEventListener('load', () => {
  setTimeout(() => {
    const row = document.getElementById('wobble-row');
    const r = row.getBoundingClientRect();
    row.dispatchEvent(new PointerEvent('pointerdown', {
      clientX: r.left + r.width * 0.3, clientY: r.top + r.height / 2, bubbles: true
    }));
  }, 600);
});
</script>
</body>
</html>
